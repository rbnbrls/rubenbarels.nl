# ── Deploy to Coolify ────────────────────────────────────────────────────────
#
# The only automatic path from `main` to production for this repo, so a green
# run must mean "Coolify built and finished the deployment".
#
# Issue #6: this workflow used to pipe `curl -s` into
# `python3 -c ... || echo "unknown"`, so a 401 `{"message":"Unauthenticated."}`
# body produced `deployment_uuid=unknown` and a green job while nothing was
# deployed. Every failure mode below is now an explicit, annotated failure:
#
#   1. Trigger  — POST /api/v1/deploy and fail unless the response is 2xx AND
#                 carries a non-empty deployments[0].deployment_uuid.
#   2. Wait     — poll the deployment record; only `finished` is success, and
#                 `failed`/`error`/`cancelled`/timeout fail the job. Kanban
#                 t_2b136b43: the poll mirrors the trigger step's status handling,
#                 so an empty token secret, a non-2xx answer (including a
#                 transport error with no status code) or a 2xx body without a
#                 usable `status` fails *immediately* with the HTTP code and the
#                 body, instead of polling for the full 60 × 20s budget and then
#                 blaming the timeout. That is the difference between fail-fast
#                 and fail-slow: every path here was already red, just late.
#
# Issue #14: the trigger used to POST an application uuid hardcoded in this file. A
# Coolify application uuid identifies one record, so re-creating the application
# (Coolify → delete + deploy again, 2026-09-25) retired that uuid and every later
# run answered `404 {"message":"No resources found."}` — runs #11 and #12 failed
# exactly there while `main` shipped nothing. The target is now resolved from the
# provider by application name (`COOLIFY_APP_NAME`, default
# `rubenbarels-nl-production`), which survives a re-creation; an explicit
# `COOLIFY_APP_UUID` (repository variable) still wins and skips the lookup. A
# missing, ambiguous or unusable lookup answer fails the job with a typed
# annotation, and a 404 from the trigger is reported as a missing application
# rather than as a stale token.
#
# COOLIFY_API_TOKEN is a Coolify API token with Deploy permission (Coolify →
# Keys & Tokens → API tokens) stored as a repository secret. It is referenced
# only through env + ${{ secrets.* }} and never echoed (GitHub masks it anyway).
#
# Behaviour is covered by tests/deploy-workflow.test.mjs (`npm test`), which runs
# these exact `run:` blocks under bash with a stubbed curl.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Worst case poll budget: 60 attempts × 20s sleep = 20 min, plus one curl per
    # attempt (59 sleeps now that the final attempt no longer sleeps). 30 min
    # leaves ~10 min of headroom instead of the ~5 min the old 25 min allowed.
    timeout-minutes: 30
    steps:
      - name: Trigger Coolify deployment
        id: trigger
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          # Repo variables may override the fleet defaults (kanban t_2b136b43,
          # item 5). An unset variable expands to "" and the `:-` default in the
          # run block applies, so this repo keeps its own values until a variable
          # is deliberately set.
          COOLIFY_API_BASE: ${{ vars.COOLIFY_API_BASE }}
          COOLIFY_APP_NAME: ${{ vars.COOLIFY_APP_NAME }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail

          COOLIFY_API_BASE="${COOLIFY_API_BASE:-https://dev.7rb.nl/api/v1}"
          # The deployment target is selected by application *name*, never by a uuid
          # baked into this file. A Coolify application uuid identifies one record:
          # re-creating the application (Coolify → delete + deploy again, which is
          # how the 2026-09-25 re-creation happened) retires the old uuid, and every
          # later run then failed with `404 {"message":"No resources found."}` —
          # exactly what runs #11 and #12 of this workflow reported. The name
          # survives a re-creation, so the workflow cannot go stale that way.
          COOLIFY_APP_NAME="${COOLIFY_APP_NAME:-rubenbarels-nl-production}"
          # An explicit COOLIFY_APP_UUID (repository variable) wins over the lookup,
          # so an operator can pin one application on purpose.
          COOLIFY_APP_UUID="${COOLIFY_APP_UUID:-}"

          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "::error title=Coolify API token missing::The COOLIFY_API_TOKEN repository secret is empty or unset, so no deployment can be triggered. Add or rotate it under Settings → Secrets and variables → Actions (Coolify → Keys & Tokens → API tokens)."
            exit 1
          fi

          if [ -z "${COOLIFY_APP_UUID}" ]; then
            # Resolve the one application named "${COOLIFY_APP_NAME}" on this
            # instance. Zero matches (renamed or removed) and more than one match
            # (ambiguous) are both typed failures: deploying to a guessed
            # application is how production ends up serving the wrong revision.
            APPS_FILE="$(mktemp)"
            LOOKUP_CODE="$(curl -sS --fail-with-body -o "${APPS_FILE}" -w '%{http_code}' \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              -H "Accept: application/json" \
              "${COOLIFY_API_BASE}/applications" || true)"
            APP_LIST="$(cat "${APPS_FILE}")"
            rm -f "${APPS_FILE}"
            case "${LOOKUP_CODE}" in
              ''|*[!0-9]*) LOOKUP_CODE="000" ;;
            esac
            # The same one-line rule as the trigger and poll bodies (kanban
            # t_0838bbdf): GitHub parses a step's stdout for workflow commands, so a
            # body carrying a line break must not reach a log line intact.
            APP_LIST_ONE_LINE="$(printf '%s' "${APP_LIST}" | tr -d '\r' | tr '\n\t' '  ' | cut -c1-500)"

            echo "Resolving Coolify application ${COOLIFY_APP_NAME} on ${COOLIFY_API_BASE} (HTTP ${LOOKUP_CODE})"

            if [ "${LOOKUP_CODE}" -lt 200 ] || [ "${LOOKUP_CODE}" -ge 300 ]; then
              echo "::error title=Coolify application lookup failed::GET ${COOLIFY_API_BASE}/applications answered HTTP ${LOOKUP_CODE}: ${APP_LIST_ONE_LINE} (HTTP 401 'Unauthenticated.' means the COOLIFY_API_TOKEN secret is stale or revoked — rotate it and re-run this workflow; issue #6)."
              exit 1
            fi

            # The python helper exits 0 (uuid on stdout), 2 (the answer is not a
            # list of applications), 3 (no application carries the name) or 4 (more
            # than one does, with their uuids on stdout), so each case can be
            # annotated for what it is instead of "the deploy failed".
            set +e
            COOLIFY_APP_UUID="$(printf '%s' "${APP_LIST}" | COOLIFY_APP_NAME="${COOLIFY_APP_NAME}" python3 -c '
          import json, os, sys

          name = os.environ["COOLIFY_APP_NAME"]
          try:
              payload = json.load(sys.stdin)
          except ValueError:
              sys.exit(2)
          if not isinstance(payload, list):
              sys.exit(2)
          matches = [entry for entry in payload if isinstance(entry, dict) and entry.get("name") == name]
          if not matches:
              sys.exit(3)
          if len(matches) > 1:
              sys.stdout.write(" ".join(str(entry.get("uuid") or "?") for entry in matches))
              sys.exit(4)
          uuid = str(matches[0].get("uuid") or "")
          if not uuid:
              sys.exit(3)
          sys.stdout.write(uuid)
          ' 2>/dev/null)"
            RESOLVE_STATUS=$?
            set -e

            case "${RESOLVE_STATUS}" in
              0) ;;
              2)
                echo "::error title=Coolify application list is unusable::GET ${COOLIFY_API_BASE}/applications answered HTTP ${LOOKUP_CODE} with a body that is not a list of applications, so the deployment target ${COOLIFY_APP_NAME} cannot be resolved: ${APP_LIST_ONE_LINE}"
                exit 1
                ;;
              4)
                CANDIDATES_ONE_LINE="$(printf '%s' "${COOLIFY_APP_UUID}" | tr -d '\r' | tr '\n\t' '  ' | cut -c1-300)"
                echo "::error title=Coolify application name is ambiguous::${COOLIFY_APP_NAME} matches more than one application on ${COOLIFY_API_BASE} (${CANDIDATES_ONE_LINE}), so the deployment target is not unique. Rename one of them, or set the COOLIFY_APP_UUID repository variable to the application that must be deployed."
                exit 1
                ;;
              *)
                echo "::error title=Coolify application not found::No application named ${COOLIFY_APP_NAME} exists on ${COOLIFY_API_BASE}, so nothing can be deployed. The application was renamed or re-created — runs #11 and #12 failed on a uuid that no longer existed for exactly that reason. Read GET ${COOLIFY_API_BASE}/applications back, then update COOLIFY_APP_NAME (or the COOLIFY_APP_UUID repository variable) to the live application."
                exit 1
                ;;
            esac

            # The resolved uuid is interpolated into the request body, so refuse
            # anything that is not the plain identifier Coolify hands out.
            case "${COOLIFY_APP_UUID}" in
              ''|*[!A-Za-z0-9._-]*)
                echo "::error title=Coolify returned an unusable application uuid::The application resolved for ${COOLIFY_APP_NAME} is not a plain [A-Za-z0-9._-] identifier, so it is not deployed: ${APP_LIST_ONE_LINE}"
                exit 1
                ;;
            esac

            echo "::notice title=Coolify deployment target::${COOLIFY_APP_NAME} (${COOLIFY_APP_UUID}) on ${COOLIFY_API_BASE}"
          fi

          echo "Triggering Coolify deployment for slimverlof..."
          BODY_FILE="$(mktemp)"
          # --fail-with-body makes curl exit non-zero on HTTP >= 400 while still
          # writing the error body to BODY_FILE, so a 401 is reported instead of
          # silently parsed. `|| true` keeps the HTTP code available for the
          # checks below instead of aborting before we can annotate the error.
          HTTP_CODE="$(curl -sS --fail-with-body -o "${BODY_FILE}" -w '%{http_code}' \
            -X POST "${COOLIFY_API_BASE}/deploy" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"${COOLIFY_APP_UUID}\", \"force\": false}" || true)"
          RESPONSE="$(cat "${BODY_FILE}")"
          rm -f "${BODY_FILE}"

          # A transport error makes curl print no status code at all; `000` keeps
          # that an explicit non-2xx instead of leaving `[ -lt ]` to fail with
          # "integer expression expected" (kanban t_2b136b43, item 2).
          case "${HTTP_CODE}" in
            ''|*[!0-9]*) HTTP_CODE="000" ;;
          esac

          # One bounded line, used by every log line and `::error` annotation that
          # quotes third-party text: GitHub annotations are line-oriented and the
          # runner parses a step's stdout for workflow commands, so a body with a
          # line break could otherwise forge an annotation or a log line (kanban
          # t_0838bbdf).
          RESPONSE_ONE_LINE="$(printf '%s' "${RESPONSE}" | tr -d '\r' | tr '\n\t' '  ' | cut -c1-500)"

          echo "HTTP ${HTTP_CODE}"
          echo "Response: ${RESPONSE_ONE_LINE}"

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            case "${HTTP_CODE}" in
              404)
                # Coolify answers `No resources found.` for an application uuid that
                # does not exist on this instance — a re-created application has a
                # different uuid — so this is a target problem, not a token problem
                # (runs #11 and #12 of this workflow failed here).
                echo "::error title=Coolify application not found::HTTP 404 from ${COOLIFY_API_BASE}/deploy for application ${COOLIFY_APP_UUID}: ${RESPONSE_ONE_LINE} (Coolify answers \"No resources found.\" when that application uuid does not exist on this instance. Re-read GET ${COOLIFY_API_BASE}/applications, then set COOLIFY_APP_NAME or the COOLIFY_APP_UUID repository variable to the live application.)"
                ;;
              *)
                echo "::error title=Coolify rejected the deployment::HTTP ${HTTP_CODE} from ${COOLIFY_API_BASE}/deploy: ${RESPONSE_ONE_LINE} (HTTP 401 'Unauthenticated.' means the COOLIFY_API_TOKEN secret is stale or revoked — rotate it and re-run this workflow; issue #6)."
                ;;
            esac
            exit 1
          fi

          # A 2xx is not proof of a queued deployment: Coolify answers
          # {"message":"..."} for errors and {"deployments":[]} when nothing was
          # queued. Only a non-empty deployment uuid counts as success.
          DEPLOY_UUID="$(printf '%s' "${RESPONSE}" | python3 -c '
          import json, sys
          try:
              payload = json.load(sys.stdin)
          except ValueError:
              sys.exit(1)
          if not isinstance(payload, dict):
              sys.exit(1)
          deployments = payload.get("deployments") or []
          if not isinstance(deployments, list) or not deployments:
              sys.exit(1)
          first = deployments[0] or {}
          uuid = first.get("deployment_uuid") or ""
          if not uuid:
              sys.exit(1)
          sys.stdout.write(uuid)
          ' 2>/dev/null || true)"

          if [ -z "${DEPLOY_UUID}" ]; then
            echo "::error title=Coolify deployment not queued::Coolify answered HTTP ${HTTP_CODE} without a deployment uuid, so nothing was deployed: ${RESPONSE_ONE_LINE}"
            exit 1
          fi

          # The uuid is published as a step output, so refuse to publish anything
          # that is not the plain identifier Coolify returns — an unexpected
          # payload cannot inject a line into $GITHUB_OUTPUT (kanban t_2b136b43,
          # item 3).
          case "${DEPLOY_UUID}" in
            *[!A-Za-z0-9._-]*)
              echo "::error title=Coolify returned an unexpected deployment uuid::The deployment uuid is not a plain [A-Za-z0-9._-] identifier, so it is not published as a step output: ${RESPONSE_ONE_LINE}"
              exit 1
              ;;
          esac

          echo "deployment_uuid=${DEPLOY_UUID}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Coolify deployment queued::${DEPLOY_UUID}"

      # A queued deployment can still fail to build (see #5, the nixpacks Node
      # version fix). Without this step the job went green the moment Coolify
      # accepted the request, so a broken build looked like a successful deploy.
      - name: Wait for Coolify deployment to finish
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_BASE: ${{ vars.COOLIFY_API_BASE }}
          COOLIFY_APP_NAME: rubenbarels-nl-production
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
          DEPLOYMENT_ATTEMPTS: "60"
          DEPLOYMENT_WAIT_SECONDS: "20"
        run: |
          set -euo pipefail

          COOLIFY_API_BASE="${COOLIFY_API_BASE:-https://dev.7rb.nl/api/v1}"
          COOLIFY_APP_NAME="${COOLIFY_APP_NAME:-rubenbarels-nl-production}"
          ATTEMPTS="${DEPLOYMENT_ATTEMPTS:-60}"
          WAIT_SECONDS="${DEPLOYMENT_WAIT_SECONDS:-20}"
          DEPLOYMENT_UUID="${DEPLOYMENT_UUID:-}"

          if [ -z "${DEPLOYMENT_UUID}" ]; then
            echo "::error title=No deployment to wait for::The trigger step reported no deployment uuid, so there is nothing to verify."
            exit 1
          fi

          # Same guard as the trigger step: without a token every poll would come
          # back 401 and, before this change, would burn the 60 × 20s budget.
          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "::error title=Coolify API token missing::The COOLIFY_API_TOKEN repository secret is empty or unset, so the deployment cannot be polled. Add or rotate it under Settings → Secrets and variables → Actions (Coolify → Keys & Tokens → API tokens)."
            exit 1
          fi

          STATUS=""
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            POLL_FILE="$(mktemp)"
            # The trigger step's status handling, applied to the poll:
            # --fail-with-body keeps the error body, -w '%{http_code}' keeps the
            # code, and `|| true` leaves both for the checks below instead of
            # aborting the step inside the loop.
            HTTP_CODE="$(curl -sS --fail-with-body -o "${POLL_FILE}" -w '%{http_code}' \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_API_BASE}/deployments/${DEPLOYMENT_UUID}" || true)"
            case "${HTTP_CODE}" in
              ''|*[!0-9]*) HTTP_CODE="000" ;;
            esac
            BODY="$(cat "${POLL_FILE}" 2>/dev/null || true)"
            rm -f "${POLL_FILE}"

            # One bounded line, so a multi-line third-party body cannot forge a
            # workflow command in an annotation or bloat the log.
            BODY_ONE_LINE="$(printf '%s' "${BODY}" | tr -d '\r' | tr '\n\t' '  ' | cut -c1-500)"

            STATUS="$(printf '%s' "${BODY}" | python3 -c '
          import json, sys
          try:
              payload = json.load(sys.stdin)
          except ValueError:
              sys.exit(1)
          if not isinstance(payload, dict):
              sys.exit(1)
          status = payload.get("status") or ""
          if not isinstance(status, str):
              sys.exit(1)
          sys.stdout.write(status)
          ' 2>/dev/null || true)"

            # `status` is third-party text too: JSON allows an escaped "\n" inside a
            # string, and it arrives here as a real line break, so the value used in
            # the log line below could forge a workflow command (kanban t_0838bbdf).
            STATUS_ONE_LINE="$(printf '%s' "${STATUS}" | tr -d '\r' | tr '\n\t' '  ' | cut -c1-200)"

            echo "[${attempt}/${ATTEMPTS}] deployment ${DEPLOYMENT_UUID}: HTTP ${HTTP_CODE} status ${STATUS_ONE_LINE:-<no status reported>}"

            # A rejected poll never turns into a success by waiting, so report the
            # HTTP code and the body now instead of burning the remaining budget
            # and failing with a timeout that hides the real reason (a 401 here
            # means the token died mid-run; a 404 means the record is gone).
            if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
              echo "::error title=Coolify API rejected the poll::GET ${COOLIFY_API_BASE}/deployments/${DEPLOYMENT_UUID} answered HTTP ${HTTP_CODE} on attempt ${attempt}/${ATTEMPTS}: ${BODY_ONE_LINE} — HTTP 401 'Unauthenticated.' means the COOLIFY_API_TOKEN secret is stale or revoked (rotate it and re-run this workflow); HTTP 404 means the deployment or its application was removed mid-build. kanban t_2b136b43."
              exit 1
            fi

            # A 2xx body without a usable status is not a deployment state either:
            # only `finished` may end this loop green, so an unusable answer is
            # reported with its body rather than retried for 20 minutes.
            if [ -z "${STATUS}" ]; then
              echo "::error title=Coolify poll answer carries no deployment status::GET ${COOLIFY_API_BASE}/deployments/${DEPLOYMENT_UUID} answered HTTP ${HTTP_CODE} with a body that has no usable status field: ${BODY_ONE_LINE}"
              exit 1
            fi

            case "${STATUS}" in
              finished)
                echo "::notice title=Coolify deployment finished::${DEPLOYMENT_UUID} built and deployed."
                exit 0
                ;;
              failed|error|cancelled|cancelled-by-user)
                echo "::error title=Coolify deployment ${STATUS}::${DEPLOYMENT_UUID} ended as ${STATUS}. Check the Coolify deployment log (https://dev.7rb.nl → ${COOLIFY_APP_NAME} → deployments) before re-running."
                exit 1
                ;;
            esac

            # No sleep after the final attempt: the job has nothing left to wait for.
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              sleep "${WAIT_SECONDS}"
            fi
          done

          echo "::error title=Coolify deployment not verified::${DEPLOYMENT_UUID} did not reach 'finished' within $((ATTEMPTS * WAIT_SECONDS))s (last status: ${STATUS_ONE_LINE:-<none>}). It may still be queued behind another build — re-run this workflow once the Coolify queue is clear."
          exit 1
