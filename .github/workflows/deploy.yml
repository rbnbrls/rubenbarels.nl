# ── Deploy to Coolify ────────────────────────────────────────────────────────
#
# The only automatic path from `main` to production for this repository, so a
# green run has to mean "Coolify was asked to build a commit, and that build
# finished".
#
# Before this change that was not true: the trigger step piped `curl -s` into
# `python3 -c ... || echo "unknown"`, so ANY answer other than a queued
# deployment — HTTP 401 `{"message":"Unauthenticated."}`, 404, a 5xx, a
# transport error, or a 2xx body without a `deployments` key — produced
# `deployment_uuid=unknown` and a green job while nothing was deployed. There
# was also no wait step, so a Coolify build that failed after being queued
# stayed green too. Every failure mode below is now an explicit, annotated
# failure:
#
#   1. Trigger — POST /api/v1/deploy and fail unless the response is 2xx AND
#                carries a non-empty deployments[0].deployment_uuid.
#   2. Wait    — poll the deployment record; only `finished` is success, and
#                `failed`/`error`/`cancelled`/timeout fail the job. A rejected
#                poll (401/403/404) fails immediately instead of burning the
#                whole poll window.
#
# COOLIFY_API_TOKEN is a Coolify API token with Deploy permission (Coolify →
# Keys & Tokens → API tokens) stored as a repository secret. It is referenced
# only through env and the secrets context and is never echoed (GitHub masks it
# anyway).
#
# Behaviour is covered by tests/deploy-workflow.test.mjs, which runs these exact
# `run:` blocks under bash with a stubbed curl:
#   node --test tests/*.test.mjs
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trigger Coolify deployment
        id: trigger
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail

          COOLIFY_API_BASE="https://dev.7rb.nl/api/v1"
          COOLIFY_APP_UUID="fs3s4diz3zx892uwcjze7hv9"
          COOLIFY_APP_NAME="rubenbarels.nl"

          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "::error title=Coolify API token missing::The COOLIFY_API_TOKEN repository secret is empty or unset, so no deployment can be triggered. Add or rotate it under Settings → Secrets and variables → Actions (Coolify → Keys & Tokens → API tokens)."
            exit 1
          fi

          echo "Triggering Coolify deployment for ${COOLIFY_APP_NAME}..."
          BODY_FILE="$(mktemp)"
          # --fail-with-body makes curl exit non-zero on HTTP >= 400 while still
          # writing the error body to BODY_FILE, so a 401 is reported instead of
          # silently parsed. `|| true` keeps the HTTP code available for the
          # checks below instead of aborting before we can annotate the error.
          HTTP_CODE="$(curl -sS --fail-with-body -o "${BODY_FILE}" -w '%{http_code}' \
            -X POST "${COOLIFY_API_BASE}/deploy" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"${COOLIFY_APP_UUID}\", \"force\": false}" || true)"
          RESPONSE="$(cat "${BODY_FILE}")"
          rm -f "${BODY_FILE}"

          echo "HTTP ${HTTP_CODE}"
          echo "Response: ${RESPONSE}"

          if [ -z "${HTTP_CODE}" ] || [ "${HTTP_CODE}" = "000" ]; then
            echo "::error title=Coolify unreachable::curl got no HTTP status from ${COOLIFY_API_BASE}/deploy (transport error): ${RESPONSE}"
            exit 1
          fi

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error title=Coolify rejected the deployment::HTTP ${HTTP_CODE} from ${COOLIFY_API_BASE}/deploy: ${RESPONSE} (HTTP 401 'Unauthenticated.' means the COOLIFY_API_TOKEN secret is stale or revoked — rotate it and re-run this workflow.)"
            exit 1
          fi

          # A 2xx is not proof of a queued deployment: Coolify answers
          # {"message":"..."} for errors and {"deployments":[]} when nothing was
          # queued. Only a non-empty deployment uuid counts as success.
          DEPLOY_UUID="$(printf '%s' "${RESPONSE}" | python3 -c '
          import json, sys
          try:
              payload = json.load(sys.stdin)
          except ValueError:
              sys.exit(1)
          if not isinstance(payload, dict):
              sys.exit(1)
          deployments = payload.get("deployments") or []
          if not isinstance(deployments, list) or not deployments:
              sys.exit(1)
          first = deployments[0] or {}
          uuid = first.get("deployment_uuid") or ""
          if not uuid:
              sys.exit(1)
          sys.stdout.write(uuid)
          ' 2>/dev/null || true)"

          if [ -z "${DEPLOY_UUID}" ]; then
            echo "::error title=Coolify deployment not queued::Coolify answered HTTP ${HTTP_CODE} without a deployment uuid, so nothing was deployed: ${RESPONSE}"
            exit 1
          fi

          echo "deployment_uuid=${DEPLOY_UUID}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Coolify deployment queued::${DEPLOY_UUID}"

      # A queued deployment can still fail to build, so without this step the
      # job went green the moment Coolify accepted the request and a broken (or
      # cancelled) build looked like a successful deploy.
      - name: Wait for Coolify deployment to finish
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
          DEPLOYMENT_ATTEMPTS: "60"
          DEPLOYMENT_WAIT_SECONDS: "20"
        run: |
          set -euo pipefail

          COOLIFY_API_BASE="https://dev.7rb.nl/api/v1"
          COOLIFY_APP_NAME="rubenbarels.nl"
          ATTEMPTS="${DEPLOYMENT_ATTEMPTS:-60}"
          WAIT_SECONDS="${DEPLOYMENT_WAIT_SECONDS:-20}"
          DEPLOYMENT_UUID="${DEPLOYMENT_UUID:-}"

          if [ -z "${DEPLOYMENT_UUID}" ]; then
            echo "::error title=No deployment to wait for::The trigger step reported no deployment uuid, so there is nothing to verify."
            exit 1
          fi

          if [ -z "${COOLIFY_API_TOKEN:-}" ]; then
            echo "::error title=Coolify API token missing::The COOLIFY_API_TOKEN repository secret is empty or unset, so the deployment cannot be verified. Add or rotate it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          STATUS=""
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            POLL_FILE="$(mktemp)"
            HTTP_CODE="$(curl -sS -o "${POLL_FILE}" -w '%{http_code}' \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_API_BASE}/deployments/${DEPLOYMENT_UUID}" || true)"
            BODY="$(cat "${POLL_FILE}" 2>/dev/null || true)"
            rm -f "${POLL_FILE}"
            STATUS="$(printf '%s' "${BODY}" | python3 -c 'import json,sys
          try:
              payload = json.load(sys.stdin)
          except ValueError:
              sys.exit(1)
          sys.stdout.write((payload or {}).get("status") or "")' 2>/dev/null || true)"
            echo "[${attempt}/${ATTEMPTS}] deployment ${DEPLOYMENT_UUID}: HTTP ${HTTP_CODE:-<none>} status ${STATUS:-<no status reported>}"

            # A rejected request does not become a success by waiting: report the
            # actual reason now instead of burning the remaining ~20 minutes.
            case "${HTTP_CODE}" in
              401|403)
                echo "::error title=Coolify API rejected the poll::GET ${COOLIFY_API_BASE}/deployments/${DEPLOYMENT_UUID} answered HTTP ${HTTP_CODE}: ${BODY} — the COOLIFY_API_TOKEN secret is stale or lacks rights; rotate it and re-run this workflow."
                exit 1
                ;;
              404)
                echo "::error title=Coolify deployment record not found::GET ${COOLIFY_API_BASE}/deployments/${DEPLOYMENT_UUID} answered HTTP 404: ${BODY} — the deployment or its application (${COOLIFY_APP_NAME}) was removed while the build was running."
                exit 1
                ;;
            esac

            case "${STATUS}" in
              finished)
                echo "::notice title=Coolify deployment finished::${DEPLOYMENT_UUID} built and deployed."
                exit 0
                ;;
              failed|error|cancelled|cancelled-by-user)
                echo "::error title=Coolify deployment ${STATUS}::${DEPLOYMENT_UUID} ended as ${STATUS}. Check the Coolify deployment log (https://dev.7rb.nl → ${COOLIFY_APP_NAME} → deployments) before re-running."
                exit 1
                ;;
            esac
            sleep "${WAIT_SECONDS}"
          done

          echo "::error title=Coolify deployment not verified::${DEPLOYMENT_UUID} did not reach 'finished' within $((ATTEMPTS * WAIT_SECONDS))s (last status: ${STATUS:-<none>}). It may still be queued behind another build — re-run this workflow once the Coolify queue is clear."
          exit 1
